<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CONDEZ — Software Development Technician</title>
  <desc id="desc">A dark futuristic banner with animated red and purple orbital lines, terminal-inspired details, and the Condez developer identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080D"/>
      <stop offset=".55" stop-color="#101018"/>
      <stop offset="1" stop-color="#160B25"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1744">
        <animate attributeName="stop-color" values="#FF1744;#A855F7;#FF1744" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7B2CFF">
        <animate attributeName="stop-color" values="#7B2CFF;#FF1744;#7B2CFF" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7B2CFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <ellipse cx="930" cy="185" rx="390" ry="290" fill="url(#glow)"/>

  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".85" filter="url(#softGlow)">
    <path d="M690 420 C790 300 810 120 1000 0" opacity=".7">
      <animate attributeName="stroke-dasharray" values="8 14;24 10;8 14" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M790 420 C900 280 900 150 1120 0" opacity=".55">
      <animate attributeName="stroke-dashoffset" values="0;180;360" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M900 420 C1010 300 1040 190 1200 100" opacity=".4"/>
    <path d="M740 340 L1200 340" opacity=".2"/>
  </g>

  <g stroke="#A855F7" stroke-opacity=".35" fill="none">
    <circle cx="1015" cy="210" r="122" stroke-dasharray="2 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1015 210" to="360 1015 210" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1015" cy="210" r="158" stroke-dasharray="1 18">
      <animateTransform attributeName="transform" type="rotate" from="360 1015 210" to="0 1015 210" dur="48s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#FFFFFF" opacity=".5">
    <circle cx="850" cy="92" r="2"/><circle cx="1090" cy="84" r="2"/>
    <circle cx="1140" cy="270" r="2"/><circle cx="915" cy="330" r="2"/>
    <circle cx="760" cy="220" r="1.5"/><circle cx="1060" cy="365" r="1.5"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="84" y="76" fill="#A1A1AA" font-size="14" letter-spacing="5">SOFTWARE ENGINEERING / COLOMBIA</text>
    <text x="78" y="205" fill="#FFFFFF" font-size="92" font-weight="800" letter-spacing="3">CONDEZ</text>
    <rect x="84" y="232" width="350" height="4" rx="2" fill="url(#neon)">
      <animate attributeName="width" values="180;350;280;350" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="84" y="282" fill="#FFFFFF" font-size="22" font-weight="600" letter-spacing="2">SOFTWARE DEVELOPMENT TECHNICIAN</text>
    <text x="84" y="326" fill="#A1A1AA" font-size="17" letter-spacing="1">Building software. Engineering solutions. Creating impact.</text>
    <text x="84" y="378" fill="#A855F7" font-family="Consolas, monospace" font-size="13">$ engineer --build --solve --evolve</text>
  </g>

  <g transform="translate(875 145)" opacity=".92">
    <rect x="0" y="0" width="250" height="150" rx="12" fill="#08080D" fill-opacity=".78" stroke="#7B2CFF" stroke-opacity=".75"/>
    <path d="M0 34H250" stroke="#7B2CFF" stroke-opacity=".45"/>
    <circle cx="18" cy="17" r="4" fill="#FF1744"/>
    <circle cx="33" cy="17" r="4" fill="#A855F7"/>
    <circle cx="48" cy="17" r="4" fill="#FFFFFF" fill-opacity=".45"/>
    <g font-family="Consolas, monospace" font-size="12">
      <text x="18" y="62" fill="#A1A1AA">$ system.status</text>
      <text x="18" y="84" fill="#FFFFFF">architecture: <tspan fill="#A855F7">modular</tspan></text>
      <text x="18" y="105" fill="#FFFFFF">focus: <tspan fill="#FF1744">backend</tspan></text>
      <text x="18" y="126" fill="#FFFFFF">status: <tspan fill="#A855F7">building...</tspan></text>
    </g>
    <circle cx="224" cy="125" r="3" fill="#FF1744">
      <animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".7"/>
</svg>
